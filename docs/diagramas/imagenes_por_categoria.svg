<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="imagenes-categoria-title imagenes-categoria-desc">
      <title id="imagenes-categoria-title">Número de imágenes por categoría del dataset EVA</title>
      <desc id="imagenes-categoria-desc">Gráfico de barras con el número de imágenes por código de categoría EVA: entre 906 y 1034 imágenes en cada una de las cinco clases entrenadas y 273 en la categoría other, que no se entrena.</desc>
