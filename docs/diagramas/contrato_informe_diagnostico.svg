        <rect x="1034" y="44" width="104" height="12" fill="#f5f5f5"/>
        <text x="1040" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NIVEL 3 · CRÍTICO</text>

