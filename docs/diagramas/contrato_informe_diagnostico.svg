          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============================================================
             ZONES (bg -> zones -> header labels -> arrows -> nodes -> legend)
             ============================================================ -->

        <!-- Nivel 2 · los cuatro especialistas -->
        <rect x="24" y="40" width="952" height="312" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="34" y="44" width="180" height="12" fill="#f5f5f5"/>
