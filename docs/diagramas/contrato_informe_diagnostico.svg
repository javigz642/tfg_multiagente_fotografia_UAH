        <text x="140" y="88" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">COMPOSICIÓN ESPACIAL</text>

        <text x="380" y="76" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AGENTE 2</text>
        <text x="380" y="88" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">LÍNEAS Y DIRECCIÓN</text>

