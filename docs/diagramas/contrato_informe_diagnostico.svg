<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contrato-informe-diagnostico-title contrato-informe-diagnostico-desc">
        <title id="contrato-informe-diagnostico-title">El contrato de las dos autorías</title>
        <desc id="contrato-informe-diagnostico-desc">Diagrama que muestra, para cada uno de los cuatro especialistas y para el crítico, dos cajas verticales unidas por una flecha: el informe o arbitraje, escrito por un motor determinista y auditable, y el diagnóstico o síntesis, redactado por un LLM que solo puede citar ese informe.</desc>

        <defs>
