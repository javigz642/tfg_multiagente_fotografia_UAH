<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="importancia-aspecto-title importancia-aspecto-desc">
      <title id="importancia-aspecto-title">Importancia promedio normalizada por categoría y aspecto</title>
      <desc id="importancia-aspecto-desc">Matriz de importancia promedio normalizada de cuatro aspectos compositivos en cinco categorías fotográficas; cada fila suma 1, los valores van de 0.22 a 0.29 y el máximo es luz y tono en paisaje natural (0.29).</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Rejilla 5×4: columnas x=270..762 (paso 164), filas y=108..380 (paso 68), celda 160×64.
           Rampa de tinta no focal lineal: opacidad = 0.07 + (v−0.22)/(0.28−0.22)·0.60.
           Celda focal (Paisaje Natural · Luz y tono) con acento y data-focal="true". -->

