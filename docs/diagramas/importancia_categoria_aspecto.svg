      <text data-axis="3" data-col="Luz y tono" x="842" y="90" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Luz y tono</text>
      <text data-row-label="Arquitectura / Escenas Urbanas" x="258" y="145" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">Arquitectura / Escenas Urbanas</text>
