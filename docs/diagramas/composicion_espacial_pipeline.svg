<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="composicion-espacial-pipeline-title composicion-espacial-pipeline-desc">
  <title id="composicion-espacial-pipeline-title">Pipeline del Agente 1 — composición espacial</title>
  <desc id="composicion-espacial-pipeline-desc">Diagrama de flujo que muestra cómo el especialista de composición espacial recibe la percepción compartida del orquestador (bbox, centroide de saliencia, sujeto_discreto y fuente), elige un punto de anclaje, calcula la distancia a los cuatro puntos de fuerza de la regla de tercios y al centro geométrico, arbitra de forma determinista entre ambos patrones, y aplica un único gate —basado en si el sujeto lo detectó YOLO— a las tres métricas ancladas, mientras el equilibrio visual se calcula de forma global y siempre citable, antes de que un LLM redacte el diagnóstico final.</desc>

  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ============================================================
       ARROWS (drawn before nodes — z-order rule)
       ============================================================ -->

  <!-- N1 Percepción compartida -> N2 Elegir anclaje (left attach 568, elbow down-left-down) -->
  <path d="M 568,136 V 152 Q 568,160 560,160 H 232 Q 224,160 224,168 V 184"
        fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- N1 Percepción compartida -> N3 d_equilibrio (right attach 712, elbow down-right-down) -->
  <path d="M 712,136 V 152 Q 712,160 720,160 H 1048 Q 1056,160 1056,168 V 184"
        fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Branch labels -->
  <rect x="364" y="140" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="396" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANCLADO</text>

  <rect x="858" y="140" width="52" height="12" rx="2" fill="#f5f5f5"/>
  <text x="884" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GLOBAL</text>

  <!-- N2 -> N4 (straight, same x) -->
  <line x1="224" y1="272" x2="224" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- N4 -> N5 (straight, same x) -->
  <line x1="224" y1="404" x2="224" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- N5 -> N6 (straight, same x) -->
  <line x1="224" y1="536" x2="224" y2="572" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- N6 Gate -> N7 Informe (attach 568, elbow down-right-down) -->
  <path d="M 224,668 V 680 Q 224,688 232,688 H 560 Q 568,688 568,696 V 704"
        fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- N3 d_equilibrio -> N7 Informe (attach 712, long pass-through, elbow down-left-down) -->
  <path d="M 1056,272 V 480 Q 1056,488 1048,488 H 720 Q 712,488 712,496 V 704"
        fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- N7 Informe -> N8 Diagnóstico -->
  <line x1="640" y1="816" x2="640" y2="852" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ============================================================
       NODES
       ============================================================ -->

  <!-- N1 · Percepción compartida (entrada) -->
  <rect x="420" y="40" width="440" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="420" y="40" width="440" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="428" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.50)" stroke-width="0.8"/>
  <text x="442" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
  <text x="640" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Percepción compartida</text>
  <text x="640" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bbox · centroide_saliencia · sujeto_discreto</text>
  <text x="640" y="110" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fuente · mapa_saliencia_path · ruta_imagen</text>

  <!-- N2 · Elegir anclaje -->
  <rect x="84" y="184" width="280" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="84" y="184" width="280" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="92" y="192" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="106" y="201" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
  <text x="224" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Elegir anclaje</text>
  <text x="224" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vía = bbox[:2] si sujeto_discreto</text>
  <text x="224" y="250" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">si no: centroide_saliencia[:2]</text>

  <!-- N3 · d_equilibrio (global) -->
  <rect x="916" y="184" width="280" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="916" y="184" width="280" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="924" y="192" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="938" y="201" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
  <text x="1056" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">d_equilibrio (global)</text>
  <text x="1056" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cv2.moments(mapa_saliencia)</text>
  <text x="1056" y="250" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">centro_masa → centro / diagonal</text>

  <!-- N4 · d_tercios & d_centro -->
  <rect x="84" y="308" width="280" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="84" y="308" width="280" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="92" y="316" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="106" y="325" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
  <text x="224" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">d_tercios &amp; d_centro</text>
  <text x="224" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">min dist. a los 4 puntos de fuerza</text>
  <text x="224" y="378" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">dist. anclaje → centro geométrico</text>
  <text x="224" y="392" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">mismo anclaje, mismo denominador</text>

  <!-- N5 · Arbitrar patrón -->
  <rect x="84" y="440" width="280" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="84" y="440" width="280" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="92" y="448" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="106" y="457" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
  <text x="224" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Arbitrar patrón</text>
  <text x="224" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">centrada si d_centro &lt; d_tercios</text>
  <text x="224" y="510" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">margen_patron = |diferencia|</text>
  <text x="224" y="524" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">decidido en el script, no en el LLM</text>

  <!-- N6 · Gate: fuente == 'yolo' -->
  <rect x="84" y="572" width="280" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="84" y="572" width="280" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="92" y="580" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="106" y="589" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
  <text x="224" y="612" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gate: fuente == 'yolo'</text>
  <text x="224" y="628" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">confianza única: tercios, centro, patrón</text>
  <text x="224" y="642" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">saliencia / sin_sujeto_claro → confianza 0</text>
  <text x="224" y="656" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YOLO aporta identidad semántica</text>

  <!-- N7 · InformeComposicionEspacial (focal) -->
  <rect x="420" y="704" width="440" height="112" rx="6" fill="#f5f5f5"/>
  <rect x="420" y="704" width="440" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="428" y="712" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
  <text x="442" y="721" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
  <text x="640" y="744" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">InformeComposicionEspacial</text>
  <text x="640" y="760" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">d_tercios · d_centro · patron_dominante · margen_patron</text>
  <text x="640" y="774" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">d_equilibrio · coord_centro_masa · coord_centroide/p_cercano</text>
  <text x="640" y="788" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">dimensiones_imagen · verificacion_path · auditable</text>

  <!-- N8 · DiagnosticoComposicionEspacial (LLM) -->
  <rect x="480" y="852" width="320" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="480" y="852" width="320" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="488" y="860" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
  <text x="502" y="869" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
  <text x="640" y="886" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DiagnosticoComposicionEspacial</text>
  <text x="640" y="902" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Gemini 2.5 Flash · cita el informe</text>
  <text x="640" y="918" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ salida_composicion_espacial.json</text>

  <!-- ============================================================
       EDITORIAL CALLOUTS (max 2, margins only)
       ============================================================ -->

  <path d="M 1160,68 Q 1020,72 868,88" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="860" cy="88" r="2" fill="#2d3142"/>
  <text x="1240" y="60" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">aquí sí llega el bbox:</text>
  <text x="1240" y="76" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">context = [compose_task]</text>


  <!-- ============================================================
       LEGEND
       ============================================================ -->
  <line x1="40" y1="988" x2="1240" y2="988" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="1008" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">LEYENDA</text>

  <rect x="132" y="1021" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="152" y="1030" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Entrada — percepción compartida del orquestador (context = [compose_task])</text>

  <rect x="132" y="1039" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="152" y="1048" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Motor determinista (NumPy / OpenCV) — auditable, recomputable</text>

  <rect x="132" y="1057" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="152" y="1066" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">InformeComposicionEspacial — el contrato que el crítico puede citar</text>

  <rect x="132" y="1075" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="152" y="1084" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Diagnóstico — LLM (Gemini), redacta citando el informe</text>

</svg>
