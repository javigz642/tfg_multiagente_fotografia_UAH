<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estructura-nivel1-title estructura-nivel1-desc">
        <title id="estructura-nivel1-title">El orquestador no mide, decide</title>
        <desc id="estructura-nivel1-desc">Estructura del Nivel 1: el agente orquestador invoca dos herramientas de CrewAI, ContextClassifierTool y SharedPerceptionTool, cada una envolviendo un motor determinista (ResNet18 con Grad-CAM, y YOLO11m con saliencia espectral que resuelve tres fuentes posibles de bbox); ambas convergen en un único esquema de salida, SalidaOrquestador, sin incluir el vector de pesos W.</desc>

        <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============================================================
             ZONES (bg -> zones -> arrows -> nodes -> callout -> legend)
             ============================================================ -->

        <!-- A) Clasificador de contexto -->
        <rect x="80" y="148" width="520" height="304" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="90" y="152" width="170" height="12" fill="#f5f5f5"/>
        <text x="96" y="161" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">A) CLASIFICADOR DE CONTEXTO</text>

        <!-- B) Percepción compartida -->
        <rect x="680" y="148" width="520" height="304" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="690" y="152" width="150" height="12" fill="#f5f5f5"/>
        <text x="696" y="161" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">B) PERCEPCIÓN COMPARTIDA</text>

        <!-- C) Output estructurado -->
        <rect x="444" y="484" width="392" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="454" y="488" width="130" height="12" fill="#f5f5f5"/>
        <text x="460" y="497" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">C) OUTPUT ESTRUCTURADO</text>

        <!-- ============================================================
             ARROWS — drawn before every node rect (z-order rule).
             El agente reparte hacia las dos tools; cada tool cae en línea
             recta sobre su motor; los dos motores convergen en la salida.
             ============================================================ -->

        <path d="M 640,128 V 130 Q 640,138 632,138 H 348 Q 340,138 340,146 V 180"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 640,128 V 130 Q 640,138 648,138 H 932 Q 940,138 940,146 V 180"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="340" y1="268" x2="340" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="940" y1="268" x2="940" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 340,436 V 468 Q 340,476 348,476 H 572 Q 580,476 580,484 V 516"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 940,436 V 468 Q 940,476 932,476 H 708 Q 700,476 700,484 V 516"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ============================================================
             NODES
             ============================================================ -->

        <!-- ── Agente orquestador ──────────────────────────────────── -->
        <rect x="500" y="40" width="280" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="40" width="280" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="508" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="522" y="57" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
        <text x="640" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agente orquestador</text>
        <text x="640" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Nivel 1 · define estrategia</text>
        <text x="640" y="110" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no analiza en profundidad</text>

        <!-- ── A · ContextClassifierTool ───────────────────────────── -->
        <rect x="200" y="180" width="280" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="180" width="280" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="208" y="188" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="222" y="197" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
        <text x="340" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ContextClassifierTool</text>
        <text x="340" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BaseTool · CrewAI</text>
        <text x="340" y="250" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">envuelve al motor, sin cómputo propio</text>

        <!-- ── A · ContextClassifier (motor) ───────────────────────── -->
        <rect x="200" y="300" width="280" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="300" width="280" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="208" y="308" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="222" y="317" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
        <text x="340" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ContextClassifier</text>
        <text x="340" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ResNet18 fine-tuneado + Grad-CAM</text>
        <text x="340" y="370" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5 clases + umbral_otro = 0.85</text>

        <text x="340" y="404" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ARTEFACTO →</text>
        <rect x="200" y="412" width="280" height="24" rx="12" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="340" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Grad-CAM → outputs/gradcam/</text>

        <!-- ── B · SharedPerceptionTool ─────────────────────────────── -->
        <rect x="800" y="180" width="280" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="180" width="280" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="808" y="188" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="822" y="197" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
        <text x="940" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SharedPerceptionTool</text>
        <text x="940" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BaseTool · CrewAI</text>
        <text x="940" y="250" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">envuelve al motor, sin cómputo propio</text>

        <!-- ── B · SharedPerceptionEngine (motor) ──────────────────── -->
        <rect x="800" y="300" width="280" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="300" width="280" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="808" y="308" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="822" y="317" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
        <text x="940" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SharedPerceptionEngine</text>
        <text x="940" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">YOLO11m + saliencia espectral</text>
        <text x="940" y="370" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">bbox + sujeto_discreto</text>

        <text x="940" y="404" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">FUENTE →</text>
        <rect x="700" y="412" width="152" height="24" rx="12" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="776" y="428" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">yolo · conf≥0.75</text>
        <rect x="864" y="412" width="152" height="24" rx="12" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="940" y="428" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">saliencia · Otsu</text>
        <rect x="1028" y="412" width="152" height="24" rx="12" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="1104" y="428" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">sin_sujeto_claro</text>

        <!-- ── C · SalidaOrquestador (foco) ─────────────────────────── -->
        <rect x="460" y="516" width="360" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="460" y="516" width="360" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="468" y="524" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="482" y="533" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
        <text x="640" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SalidaOrquestador</text>
        <text x="640" y="572" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">{etiqueta_contexto, percepcion_compartida}</text>
        <text x="640" y="586" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">compose_task → salida_orquestador.json</text>

        <!-- ============================================================
             ANNOTATION CALLOUT — lo que deliberadamente falta aquí
             ============================================================ -->
        <text x="1240" y="492" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">W no viaja aquí</text>
        <text x="1240" y="510" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">solo lo lee el crítico</text>
        <path d="M 1155,514 Q 990,556 824,540" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="824" cy="540" r="2" fill="#2d3142"/>

        <!-- ============================================================
             LEGEND — horizontal strip at the bottom
             ============================================================ -->
        <line x1="40" y1="644" x2="1240" y2="644" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="664" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">LEYENDA</text>

        <rect x="132" y="677" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="152" y="686" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Agente orquestador — LLM que decide, no mide</text>

        <rect x="132" y="695" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="152" y="704" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Herramienta + motor — Tool de CrewAI envolviendo un cómputo determinista</text>

        <rect x="132" y="713" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="152" y="722" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">SalidaOrquestador — único punto de convergencia de Nivel 1</text>

        <rect x="132" y="731" width="14" height="10" rx="5" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="152" y="740" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">resultado posible del motor — no es un nodo del pipeline</text>

      </svg>
