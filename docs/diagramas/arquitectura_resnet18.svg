<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 992" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="resnet18-title resnet18-desc">
        <title id="resnet18-title">ResNet18, capa a capa</title>
        <desc id="resnet18-desc">Arquitectura general de ResNet18: un tronco de ocho tramos (entrada, stem, cuatro grupos de capas residuales de resolución decreciente y canales crecientes, cabeza de clasificación y salida) junto a un panel de detalle que muestra la anatomía interna de un bloque residual, con su atajo (shortcut) sumado tras dos convoluciones.</desc>

        <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============================================================
             ZONES (bg -> zones -> arrows -> nodes -> callouts -> legend)
             ============================================================ -->

        <rect x="20" y="100" width="520" height="732" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="30" y="104" width="210" height="12" fill="#f5f5f5"/>
        <text x="36" y="113" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TRONCO PRINCIPAL (18 CAPAS CON PESOS)</text>

        <rect x="680" y="100" width="560" height="460" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="690" y="104" width="150" height="12" fill="#f5f5f5"/>
        <text x="696" y="113" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DETALLE — UN BASICBLOCK</text>
        <text x="920" y="128" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">el mismo patrón se repite en Layer1–Layer4</text>

        <!-- ============================================================
             TRONCO — arrows first (z-order), un tramo recto de 8 nodos
             ============================================================ -->

        <line x1="280" y1="200" x2="280" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="288" x2="280" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="376" x2="280" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="464" x2="280" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="552" x2="280" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="640" x2="280" y2="664" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="728" x2="280" y2="752" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ── Entrada ──────────────────────────────────────────────── -->
        <rect x="120" y="136" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="136" width="320" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="280" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Entrada</text>
        <text x="280" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">imagen RGB · 224×224×3</text>

        <!-- ── Stem (conv1) ─────────────────────────────────────────── -->
        <rect x="120" y="224" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="224" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="128" y="230" width="20" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="138" y="238" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">W</text>
        <text x="280" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stem (conv1)</text>
        <text x="280" y="266" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Conv 7×7/2, 64 · BN · ReLU · MaxPool 3×3/2</text>
        <text x="280" y="278" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ 56×56×64</text>

        <!-- ── Layer1 (conv2_x) ─────────────────────────────────────── -->
        <rect x="120" y="312" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="312" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="128" y="318" width="20" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="138" y="326" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">W</text>
        <text x="280" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Layer1 (conv2_x)</text>
        <text x="280" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2× BasicBlock · 64 canales</text>
        <text x="280" y="366" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ 56×56×64</text>

        <!-- ── Layer2 (conv3_x) ─────────────────────────────────────── -->
        <rect x="120" y="400" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="400" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="128" y="406" width="20" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="138" y="414" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">W</text>
        <text x="280" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Layer2 (conv3_x)</text>
        <text x="280" y="442" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2× BasicBlock · 128 canales, /2</text>
        <text x="280" y="454" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ 28×28×128</text>

        <!-- ── Layer3 (conv4_x) ─────────────────────────────────────── -->
        <rect x="120" y="488" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="488" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="128" y="494" width="20" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="138" y="502" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">W</text>
        <text x="280" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Layer3 (conv4_x)</text>
        <text x="280" y="530" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2× BasicBlock · 256 canales, /2</text>
        <text x="280" y="542" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ 14×14×256</text>

        <!-- ── Layer4 (conv5_x) ─────────────────────────────────────── -->
        <rect x="120" y="576" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="576" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="128" y="582" width="20" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="138" y="590" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">W</text>
        <text x="280" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Layer4 (conv5_x)</text>
        <text x="280" y="618" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2× BasicBlock · 512 canales, /2</text>
        <text x="280" y="630" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ 7×7×512</text>

        <!-- ── Head ─────────────────────────────────────────────────── -->
        <rect x="120" y="664" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="664" width="320" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="128" y="670" width="20" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="138" y="678" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">W</text>
        <text x="280" y="692" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Head</text>
        <text x="280" y="706" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AvgPool 7×7 · FC 512→1000</text>
        <text x="280" y="718" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ 1000 clases (ImageNet)</text>

        <!-- ── Salida ───────────────────────────────────────────────── -->
        <rect x="120" y="752" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="120" y="752" width="320" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="280" y="780" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Salida</text>
        <text x="280" y="798" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vector de 1000 logits</text>

        <!-- ============================================================
             DETALLE — anatomía de un BasicBlock (arrows first, z-order)
             ============================================================ -->

        <line x1="920" y1="144" x2="920" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <circle cx="920" cy="160" r="2" fill="#2d3142"/>

        <path d="M 920,160 H 1092 Q 1100,160 1100,168 V 384 Q 1100,392 1092,392 H 936"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <line x1="920" y1="248" x2="920" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="920" y1="348" x2="920" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="920" y1="408" x2="920" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="920" y1="492" x2="920" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ── Conv 3×3, stride s ───────────────────────────────────── -->
        <rect x="780" y="176" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="780" y="176" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="788" y="184" width="20" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="798" y="192" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">W</text>
        <text x="920" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conv 3×3, stride s</text>
        <text x="920" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ BatchNorm → ReLU</text>

        <!-- ── Conv 3×3, stride 1 ───────────────────────────────────── -->
        <rect x="780" y="276" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="780" y="276" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="788" y="284" width="20" height="10" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="798" y="292" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">W</text>
        <text x="920" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conv 3×3, stride 1</text>
        <text x="920" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ BatchNorm</text>

        <!-- ── Suma (⊕), foco del diagrama ──────────────────────────── -->
        <circle cx="920" cy="392" r="16" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="920" y="397" fill="#eb6c36" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">+</text>

        <!-- ── ReLU final ───────────────────────────────────────────── -->
        <rect x="780" y="436" width="280" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="780" y="436" width="280" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="920" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReLU</text>
        <text x="920" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">activación final del bloque</text>

        <text x="920" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">y = ReLU(F(x) + x)</text>
        <text x="920" y="550" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ siguiente bloque</text>

        <text x="1110" y="270" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">identity,</text>
        <text x="1110" y="282" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace">o 1×1+BN si cambia forma</text>

        <!-- ============================================================
             ANNOTATION CALLOUT — por qué importa el atajo
             ============================================================ -->
        <text x="1240" y="340" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">sin el atajo,</text>
        <text x="1240" y="356" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">el gradiente</text>
        <text x="1240" y="372" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">se perdía</text>
        <path d="M 1150,368 Q 1000,370 920,376" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="920" cy="376" r="2" fill="#2d3142"/>

        <!-- ============================================================
             LEGEND — horizontal strip at the bottom
             ============================================================ -->
        <line x1="40" y1="872" x2="1240" y2="872" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="892" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">LEYENDA</text>

        <rect x="132" y="905" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="152" y="914" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Capa con pesos (Conv / FC) — cuenta para las «18»</text>

        <line x1="132" y1="923" x2="146" y2="923" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="152" y="932" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Atajo (shortcut) — identity, o proyección 1×1 si cambia la forma</text>

        <circle cx="139" cy="941" r="5" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="152" y="950" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Suma elemento a elemento — y = F(x) + x, el mecanismo del residuo</text>

        <rect x="132" y="959" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="152" y="968" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Sin pesos — tensor de entrada/salida, o activación (ReLU)</text>

      </svg>
