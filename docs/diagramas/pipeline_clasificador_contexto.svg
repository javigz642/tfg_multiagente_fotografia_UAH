<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 384" role="img" aria-labelledby="pipeline-title pipeline-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="pipeline-title">Arquitectura del pipeline del clasificador de contexto</title>
      <desc id="pipeline-desc">Diagrama de flujo que muestra el pipeline completo: dataset EVA y preprocesamiento de datos, fine-tuning ligero de un backbone ResNet18 preentrenado, evaluación con calibración de un umbral de rechazo a la clase "otro", explicabilidad con Grad-CAM, y la entrega de artefactos finales que se integran como etiqueta de contexto en el orquestador multiagente del TFG.</desc>

      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="1080" height="384" fill="#f5f5f5"/>

      <!-- ===== ZONES (painted before arrows/nodes) ===== -->
      <!-- DATOS -->
      <rect x="24" y="136" width="344" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="36" y="140" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="62" y="149" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATOS</text>

      <!-- MODELO -->
      <rect x="368" y="32" width="172" height="224" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="380" y="36" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="410" y="45" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MODELO</text>

      <!-- EVALUACIÓN -->
      <rect x="540" y="96" width="172" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="552" y="100" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="590" y="109" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EVALUACIÓN</text>

      <!-- ===== ARROWS (before node rects) ===== -->
      <!-- N1 -> N2 -->
      <line x1="180" y1="204" x2="212" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- N2 -> N3 -->
      <line x1="352" y1="204" x2="384" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- AUX (ResNet18) -> N3 -->
      <line x1="454" y1="128" x2="454" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- N3 -> N4top (Evaluación) -->
      <path d="M524,192 H532 Q540,192 540,184 V168 Q540,160 548,160 H556" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- N3 -> N4bottom (Grad-CAM) -->
      <path d="M524,216 H532 Q540,216 540,224 V240 Q540,248 548,248 H556" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- N4top -> N6 -->
      <path d="M696,160 H704 Q712,160 712,168 V184 Q712,192 720,192 H728" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- N4bottom -> N6 -->
      <path d="M696,248 H704 Q712,248 712,240 V224 Q712,216 720,216 H728" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- N6 -> N7 (accent, focal arrival) -->
      <line x1="868" y1="204" x2="900" y2="204" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- ===== NODES ===== -->

      <!-- AUX: ResNet18 -->
      <rect x="388" y="64" width="132" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="388" y="64" width="132" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="396" y="70" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="412" y="79" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CNN</text>
      <text x="454" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ResNet18</text>
      <text x="454" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ImageNet-1k</text>

      <!-- N1: EVA Dataset -->
      <rect x="40" y="168" width="140" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="168" width="140" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="48" y="176" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="64" y="185" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="110" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EVA Dataset</text>
      <text x="110" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5101 imgs · sort 1–6</text>

      <!-- N2: Preprocesamiento -->
      <rect x="212" y="168" width="140" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="212" y="168" width="140" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="220" y="176" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="236" y="185" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PREP</text>
      <text x="282" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Preprocesamiento</text>
      <text x="282" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">6→5 clases · 70/15/15</text>

      <!-- N3: Entrenamiento -->
      <rect x="384" y="168" width="140" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="168" width="140" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="392" y="176" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="410" y="185" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRAIN</text>
      <text x="454" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Entrenamiento</text>
      <text x="454" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">congelado → layer4</text>

      <!-- N4top: Evaluación -->
      <rect x="556" y="128" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="556" y="128" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="564" y="134" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="580" y="143" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVAL</text>
      <text x="626" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Evaluación</text>
      <text x="626" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">val/test+otro → umbral</text>

      <!-- N4bottom: Grad-CAM (FOCAL) -->
      <rect x="556" y="216" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="556" y="216" width="140" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="564" y="222" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
      <text x="578" y="231" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">XAI</text>
      <text x="626" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Grad-CAM</text>
      <text x="626" y="266" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">última conv → heatmap</text>

      <!-- N6: Artefactos finales -->
      <rect x="728" y="168" width="140" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="728" y="168" width="140" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="736" y="176" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="750" y="185" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="798" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Artefactos</text>
      <text x="798" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.pt · umbral.json</text>

      <!-- N7: Integración orquestador (FOCAL) -->
      <rect x="900" y="168" width="140" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="900" y="168" width="140" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="908" y="176" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
      <text x="922" y="185" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TFG</text>
      <text x="970" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Integración</text>
      <text x="970" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">etiqueta → vector W</text>

      <!-- ===== LEGEND ===== -->
      <line x1="30" y1="312" x2="1050" y2="312" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="30" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TIPO</text>
      <rect x="90" y="325" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="110" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">proceso</text>
      <rect x="200" y="325" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="220" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">datos / almacén</text>
      <rect x="360" y="325" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="380" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">preentrenado externo</text>
      <rect x="540" y="325" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="560" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">foco (XAI / integración TFG)</text>

      <text x="30" y="353" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">FLUJO</text>
      <line x1="90" y1="349" x2="118" y2="349" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="128" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">datos / modelo interno</text>
      <line x1="330" y1="349" x2="358" y2="349" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="368" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">salida al orquestador multiagente</text>

    </svg>
