<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="900" viewBox="0 0 1280 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estructura-nivel3-critico-title estructura-nivel3-critico-desc">
      <title id="estructura-nivel3-critico-title">Estructura del agente crítico (Nivel 3)</title>
      <desc id="estructura-nivel3-critico-desc">El agente crítico recibe los informes del Nivel 2 como contexto, obtiene de PrioridadTool el orden y las métricas citables según el vector W y, si el flag lo permite, observaciones de contenido de LecturaVisualTool, y con las tres fuentes redacta la CriticaCompositiva.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1280" height="900" fill="#f5f5f5"/>

      <!-- ============ ZONAS ============ -->
      <rect x="40" y="224" width="580" height="400" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="52" y="228" width="168" height="18" rx="2" fill="#f5f5f5"/>
      <text x="60" y="241" fill="#2d3142" fill-opacity="0.45" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.08em">A) ARBITRAJE POR W</text>

      <rect x="660" y="224" width="580" height="400" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="672" y="228" width="148" height="18" rx="2" fill="#f5f5f5"/>
      <text x="680" y="241" fill="#2d3142" fill-opacity="0.45" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.08em">B) LECTURA VISUAL</text>

      <!-- ============ CONECTORES (antes que los nodos) ============ -->
      <!-- Contexto -> agente -->
      <line x1="360" y1="104" x2="478" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="382" y="78" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="420" y="90" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CONTEXTO</text>

      <!-- PrioridadTool -> agente -->
      <path d="M 460,256 V 200 Q 460,192 468,192 H 552 Q 560,192 560,184 V 162" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="470" y="232" width="84" height="16" rx="2" fill="#f5f5f5"/>
      <text x="474" y="244" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">ARBITRAJE</text>

      <!-- LecturaVisualTool -> agente (opcional) -->
      <path d="M 820,256 V 200 Q 820,192 812,192 H 728 Q 720,192 720,184 V 162" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="830" y="232" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="834" y="244" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">OBSERVACIONES</text>

      <!-- Tool -> motor (A y B) -->
      <line x1="460" y1="352" x2="460" y2="392" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="820" y1="352" x2="820" y2="392" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- Informes en disco -> PrioridadEngine -->
      <line x1="216" y1="432" x2="318" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="240" y="406" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="268" y="418" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RELEE</text>

      <!-- Vector W -> PrioridadEngine -->
      <line x1="216" y1="552" x2="318" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="236" y="526" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="268" y="538" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FILA W</text>

      <!-- LecturaVisualEngine -> caché -->
      <line x1="960" y1="432" x2="1038" y2="432" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="964" y="406" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1000" y="418" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PERSISTE</text>

      <!-- Agente -> CriticaCompositiva -->
      <line x1="640" y1="160" x2="640" y2="670" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="648" y="636" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="652" y="648" fill="#eb6c36" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">REDACTA</text>

      <!-- ============ NODOS ============ -->
      <!-- Contexto de entrada -->
      <rect x="40" y="48" width="320" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="48" width="320" height="112" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="52" y="58" width="32" height="14" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.6" stroke-width="0.8"/>
      <text x="68" y="68" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="200" y="98" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contexto de 5 tareas</text>
      <text x="200" y="122" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">etiqueta_contexto (Nivel 1)</text>
      <text x="200" y="142" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">4 × {informe, diagnostico}</text>

      <!-- Agente crítico -->
      <rect x="480" y="48" width="320" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="48" width="320" height="112" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1.2"/>
      <rect x="492" y="58" width="36" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="510" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="640" y="98" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agente crítico</text>
      <text x="640" y="122" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Nivel 3 · gemini-2.5-pro</text>
      <text x="640" y="142" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">arbitra y redacta, no mide</text>

      <!-- Anotación: tres fuentes, tres jurisdicciones -->
      <text x="864" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TRES FUENTES · TRES JURISDICCIONES</text>
      <line x1="864" y1="80" x2="1240" y2="80" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="864" y="104" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">la cifra la pone el informe del especialista,</text>
      <text x="864" y="126" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">el orden lo pone W según el contexto,</text>
      <text x="864" y="148" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">el sustantivo lo pone la lectura visual.</text>

      <!-- PrioridadTool -->
      <rect x="320" y="256" width="280" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="256" width="280" height="96" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="332" y="266" width="40" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
      <text x="352" y="276" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
      <text x="460" y="306" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PrioridadTool</text>
      <text x="460" y="330" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">se invoca primero</text>

      <!-- PrioridadEngine -->
      <rect x="320" y="392" width="280" height="200" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="392" width="280" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="332" y="402" width="36" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="350" y="412" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
      <text x="460" y="452" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PrioridadEngine</text>
      <text x="460" y="480" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">orden por W · desempate fijo</text>
      <text x="460" y="504" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">confianza &gt; 0 → citable</text>
      <text x="460" y="528" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">confianza = 0 → cerrada</text>
      <text x="460" y="552" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">cobertura por dimensión</text>

      <!-- Informes en disco -->
      <rect x="56" y="392" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="392" width="160" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="136" y="420" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Informes N2</text>
      <text x="136" y="442" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">salida_*.json ×4</text>
      <text x="136" y="460" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">stem == imagen</text>

      <!-- Vector W -->
      <rect x="56" y="512" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="512" width="160" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="136" y="540" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vector W</text>
      <text x="136" y="562" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">pesos_contextuales</text>
      <text x="136" y="580" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">fila = etiqueta</text>

      <!-- LecturaVisualTool (opcional) -->
      <rect x="680" y="256" width="280" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="256" width="280" height="96" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="692" y="266" width="40" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
      <text x="712" y="276" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
      <text x="820" y="306" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LecturaVisualTool</text>
      <text x="820" y="330" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">FLAG_CRITICO_VE_IMAGEN</text>

      <!-- LecturaVisualEngine -->
      <rect x="680" y="392" width="280" height="200" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="392" width="280" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="692" y="402" width="36" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="710" y="412" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
      <text x="820" y="452" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LecturaVisualEngine</text>
      <text x="820" y="480" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">gemini-2.5-flash · T = 0.2</text>
      <text x="820" y="504" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">3–6 observaciones</text>
      <text x="820" y="528" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">de contenido, sin cifras</text>
      <text x="820" y="552" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">vetadas las 4 dimensiones</text>

      <!-- Caché de la lectura -->
      <rect x="1040" y="392" width="176" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="1040" y="392" width="176" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="1128" y="420" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Caché lectura</text>
      <text x="1128" y="442" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">{stem}_lectura.json</text>
      <text x="1128" y="460" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">por version_prompt</text>

      <!-- CriticaCompositiva (foco) -->
      <rect x="360" y="672" width="560" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="672" width="560" height="112" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="372" y="682" width="36" height="14" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.6" stroke-width="0.8"/>
      <text x="390" y="692" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="640" y="720" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CriticaCompositiva</text>
      <text x="640" y="744" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">{arbitraje, afirmaciones, tensiones, observaciones_visuales,</text>
      <text x="640" y="764" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">salvedades, sintesis, vio_imagen} → salida_critica.json</text>

      <!-- ============ LEYENDA ============ -->
      <line x1="40" y1="816" x2="1240" y2="816" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="840" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="40" y="858" width="20" height="12" rx="2" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
      <text x="68" y="868" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Agente — LLM que decide, no mide</text>

      <rect x="280" y="858" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="308" y="868" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Tool + motor — cómputo o consulta</text>

      <rect x="520" y="858" width="20" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="548" y="868" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Fichero en disco — JSON</text>

      <line x1="720" y1="864" x2="752" y2="864" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="760" y="868" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Opcional — solo si el flag está activo</text>

      <rect x="1000" y="858" width="20" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="1028" y="868" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">Salida estructurada del Nivel 3</text>
    </svg>
