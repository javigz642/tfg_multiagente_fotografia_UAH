<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flujo-clasificador-title flujo-clasificador-desc">
        <title id="flujo-clasificador-title">De la imagen a la ponderación</title>
        <desc id="flujo-clasificador-desc">Diagrama de flujo: el clasificador de contexto preprocesa la imagen, calcula logits y softmax, y decide entre emitir la clase predicha con su mapa Grad-CAM o «otro» según un umbral de confianza de 0.85; la etiqueta resultante sale del orquestador y, de forma independiente, el crítico la usa para que VectorPesosTool seleccione la fila del vector W con la que PrioridadTool pondera los cuatro informes del Nivel 2.</desc>

        <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============================================================
             ZONES
             ============================================================ -->

        <rect x="260" y="48" width="756" height="676" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="270" y="52" width="230" height="12" fill="#f5f5f5"/>
        <text x="276" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NIVEL 1 · CLASIFICADOR DE CONTEXTO</text>

        <rect x="260" y="748" width="800" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="270" y="752" width="190" height="12" fill="#f5f5f5"/>
        <text x="276" y="761" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NIVEL 3 · EL CRÍTICO PONDERA</text>

        <!-- ============================================================
             NIVEL 1 — arrows first (z-order)
             ============================================================ -->

        <line x1="460" y1="136" x2="460" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="460" y1="236" x2="460" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="460" y1="352" x2="460" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="460" y1="480" x2="460" y2="508" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="470" y="486" width="86" height="12" rx="2" fill="#f5f5f5"/>
        <text x="513" y="495" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">NO (&lt; 0.85)</text>

        <line x1="560" y1="430" x2="640" y2="430" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="566" y="410" width="86" height="12" rx="2" fill="#f5f5f5"/>
        <text x="609" y="419" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SÍ (≥ 0.85)</text>

        <line x1="460" y1="580" x2="460" y2="604" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 808,472 V 600 Q 808,608 800,608 H 464"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <circle cx="460" cy="608" r="4" fill="#2d3142"/>
        <line x1="460" y1="612" x2="460" y2="636" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="460" y1="708" x2="460" y2="780" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ── Imagen (inicio) ──────────────────────────────────────── -->
        <ellipse cx="460" cy="108" rx="100" ry="28" fill="#f5f5f5"/>
        <ellipse cx="460" cy="108" rx="100" ry="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="460" y="113" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Imagen</text>

        <!-- ── (1) Preprocesar ──────────────────────────────────────── -->
        <rect x="300" y="164" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="164" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="308" y="172" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="322" y="181" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
        <text x="460" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">(1) Preprocesar</text>
        <text x="460" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eval_transform</text>
        <text x="460" y="232" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Resize(256) → CenterCrop(224) → Normalize</text>

        <!-- ── (2) Forward + softmax ────────────────────────────────── -->
        <rect x="300" y="264" width="320" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="264" width="320" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="308" y="272" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="322" y="281" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
        <text x="460" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">(2) Forward + softmax</text>
        <text x="460" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">logits = modelo(x)</text>
        <text x="460" y="334" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">probs = softmax(logits, dim=1)</text>

        <!-- ── (3) Decisión ─────────────────────────────────────────── -->
        <polygon points="460,380 560,430 460,480 360,430" fill="#f5f5f5"/>
        <polygon points="460,380 560,430 460,480 360,430" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="460" y="424" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">(3) prob_max</text>
        <text x="460" y="438" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">≥ 0.85 ?</text>

        <!-- ── «otro» ───────────────────────────────────────────────── -->
        <rect x="300" y="508" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="508" width="320" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="460" y="542" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«otro»</text>
        <text x="460" y="558" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">confianza insuficiente (&lt; 0.85)</text>

        <!-- ── Clase predicha + Grad-CAM ────────────────────────────── -->
        <rect x="640" y="384" width="336" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="384" width="336" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="648" y="392" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="662" y="401" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
        <text x="808" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clase predicha + Grad-CAM</text>
        <text x="808" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clase = idx_to_class[argmax(probs)]</text>
        <text x="808" y="452" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CAM sobre layer4[-1] → outputs/gradcam/</text>

        <!-- ── etiqueta_contexto ────────────────────────────────────── -->
        <rect x="300" y="636" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="636" width="320" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="460" y="670" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">etiqueta_contexto</text>
        <text x="460" y="686" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sale en SalidaOrquestador (compose_task)</text>

        <!-- ============================================================
             ANNOTATION CALLOUT — la corrección central de este diagrama
             ============================================================ -->
        <text x="1240" y="644" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">el orquestador solo emite</text>
        <text x="1240" y="660" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">la etiqueta — W se queda</text>
        <text x="1240" y="676" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">aislado, y solo el crítico lo lee</text>
        <path d="M 1150,668 Q 900,670 620,672" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="620" cy="672" r="2" fill="#2d3142"/>

        <!-- ============================================================
             NIVEL 3 — arrows first (z-order)
             ============================================================ -->

        <path d="M 460,868 V 892 Q 460,900 468,900 H 600 Q 608,900 608,908 V 932"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 860,868 V 892 Q 860,900 852,900 H 721 Q 713,900 713,908 V 932"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ── VectorPesosTool (crítico) ────────────────────────────── -->
        <rect x="300" y="780" width="320" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="780" width="320" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="308" y="788" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="322" y="797" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
        <text x="460" y="820" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VectorPesosTool (crítico)</text>
        <text x="460" y="836" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">busca etiqueta_contexto en pesos_contextuales.json</text>
        <text x="460" y="848" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ fila W [composición, líneas, espacio, luz]</text>

        <!-- ── 4 informes · Nivel 2 ─────────────────────────────────── -->
        <rect x="700" y="780" width="320" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="780" width="320" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="860" y="812" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 informes · Nivel 2</text>
        <text x="860" y="828" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">salida_composicion · salida_lineas</text>
        <text x="860" y="840" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">salida_espacio · salida_luz_tono</text>

        <!-- ── PrioridadTool (foco) ─────────────────────────────────── -->
        <rect x="500" y="932" width="320" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="932" width="320" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="508" y="940" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="522" y="949" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENG</text>
        <text x="660" y="972" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PrioridadTool → ArbitrajeCritico</text>
        <text x="660" y="988" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cruza confianza × W, campo a campo</text>
        <text x="660" y="1000" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ orden por W, cobertura por especialista</text>

        <!-- ============================================================
             LEGEND — horizontal strip at the bottom
             ============================================================ -->
        <line x1="40" y1="1076" x2="1240" y2="1076" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="1096" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">LEYENDA</text>

        <rect x="132" y="1109" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="152" y="1118" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Paso de cómputo — motor determinista, sin LLM</text>

        <polygon points="139,1123 146,1128 139,1133 132,1128" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="152" y="1132" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Decisión — umbral de confianza (constante calibrada)</text>

        <circle cx="139" cy="1145" r="4" fill="#2d3142"/>
        <text x="152" y="1150" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Punto de fusión — ambas ramas producen la misma etiqueta</text>

        <rect x="132" y="1159" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="152" y="1168" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nivel1 calcula la etiqueta; Nivel3 la consume por separado — W nunca cruza esa frontera</text>

      </svg>
