[project]
name = "tfg_multiagente_fotografia"
version = "0.1.0"
description = "tfg-multiagente-fotografia using crewAI"
authors = [{ name = "Javier", email = "edisonjaviertg@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai]>=1.14.4",
    "grad-cam>=1.5.5",
    "opencv-contrib-python>=5.0.0.93",
    "pillow>=12.2.0",
    "scikit-learn>=1.7.2",
    "streamlit>=1.40.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "ultralytics>=8.4.102",
]

[project.scripts]
run_crew = "tfg_multiagente_fotografia.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "aac39668-e669-44da-adce-8e64186989d9"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
